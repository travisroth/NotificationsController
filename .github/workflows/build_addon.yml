name: build addon

on:
  push:
    tags: ["*"]
    # To build on main/master branch, uncomment the following line:
    # branches: [ main , master ]

  pull_request:
    branches: [ main, master ]

  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - run: echo -e "pre-commit\nscons\nmarkdown\nruff==0.16.8\nregex">requirements.txt

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        # The Python that NVDA 2026 runs on.
        python-version: 3.13
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip wheel
        pip install -r requirements.txt
        sudo apt-get update  -y
        sudo apt-get install -y gettext

    - name: Code checks
      run: export SKIP=no-commit-to-branch; pre-commit run --all

    # The add-on's own code. sconstruct and site_scons come from the NVDA add-on template.
    - name: Lint
      run: ruff check addon tests tools buildVars.py && ruff format --check addon tests tools

    # The parts of the add-on that do not need NVDA. The regex package, which NVDA ships, is installed
    # so the regular expression timeout is tested as it runs inside NVDA. The smoke tests in tests/nvda
    # need an NVDA source checkout with its helper DLLs built, so they run locally.
    - name: Unit tests
      run: python -m unittest discover -s . -t . -v

    - name: building addon
      run: scons && scons pot

    - uses: actions/upload-artifact@v7
      with:
        name: packaged_addon
        path: |
          ./*.nvda-addon
          ./*.pot

  upload_release:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: ["build"]
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
    - name: download releases files
      uses: actions/download-artifact@v6
    - name: Display structure of downloaded files
      run: ls -R
    - name: Calculate sha256
      run: |
        echo -e "\nSHA256: " >> changelog.md
        sha256sum *.nvda-addon >> changelog.md

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          *.nvda-addon
          *.pot
        body_path: changelog.md
        fail_on_unmatched_files: true
        prerelease: ${{ contains(github.ref, '-') }}
